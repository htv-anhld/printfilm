# Override cục bộ: đổi cổng host để tránh đụng các container khác trên máy
services:
  postgres:
    ports: !override
      - "15432:5432"
  redis:
    ports: !override
      - "16380:6379"
  api:
    ports: !override
      - "18000:8000"
  web:
    ports: !override
      - "18080:80"
  admin-web:
    ports: !override
      - "18081:80"
