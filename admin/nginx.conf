# 管理端静态站：同源反代 /api 与 /static
server {
    listen 80;
    server_name _;
    # 用 Docker 内置 DNS 动态解析 api：容器重建后 IP 变化也不会 502（变量形式的 proxy_pass 才会走 resolver）
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;
    client_max_body_size 512m;
    gzip on;
    # 压缩级别 6 体积/CPU 折中；<1KB 不压；Vary 让 CDN 区分压缩版本
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml application/manifest+json font/ttf font/otf application/vnd.ms-fontobject;

    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }

    location /static/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
    }

    # 入口 HTML 每次协商（no-cache 而非 no-store，保留浏览器前进/后退缓存）
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache" always;
    }

    # 带 hash 的打包产物可长缓存
    location /assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
