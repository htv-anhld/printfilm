# 用户端静态站：同源反代 /api、/static、易支付 notify
server {
    listen 80;
    server_name _;
    # 用 Docker 内置 DNS 动态解析 api：容器重建后 IP 变化也不会 502（变量形式的 proxy_pass 才会走 resolver）
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;
    client_max_body_size 512m;
    gzip on;
    # 压缩级别 6 体积/CPU 折中；<1KB 不压；Vary 让 CDN 区分压缩版本
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml application/manifest+json font/ttf font/otf application/vnd.ms-fontobject;

    location = /epay/notify {
        proxy_pass $api_upstream/api/billing/epay/notify$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # OAuth / MCP 元数据（MCP 客户端按 RFC 8414 / 9728 在站点根查找）
    location /.well-known/oauth- {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Stable business shares and the Apple Universal Links association.
    location /s/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /.well-known/assetlinks.json {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
    }

    location = /.well-known/apple-app-site-association {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
    }

    # Session credentials must not enter ordinary proxy access logs.
    location ~ ^/api/marketplace/app/v1/(playback-sessions|share-sessions)/ {
        access_log off;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }

    # Canvas awareness uses authenticated WebSocket frames, never URL tokens.
    location ~ ^/api/printfilm-studio/projects/[0-9]+/presence$ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
        proxy_buffering off;
    }

    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }

    location /static/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
    }

    # 入口 HTML 每次协商（ETag 304）：发版后浏览器立即拿到新的 bundle 文件名；
    # 用 no-cache 而非 no-store，保留浏览器前进/后退缓存（bfcache）
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache" always;
    }

    # 前端路由 /assets（资产库）与打包目录 /assets/ 同名：精确匹配时直接回 SPA，避免目录 301/403
    location = /assets {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }

    # 带 hash 的打包产物可长缓存
    location /assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
